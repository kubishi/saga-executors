[project]
name = "saga-executors"
version = "0.1.0"
description = "Execute SAGA DAG schedules on real systems (Kubernetes/Wayline, Slurm) and compare predicted vs. actual makespans"
readme = "README.md"
authors = [
    { name = "Jared Coleman" },
    { name = "Nick Laus" },
    { name = "Sebastian Lange" },
]
requires-python = ">=3.12"
dependencies = [
    "anrg-saga>=2.1.0",
    "numpy",
    "matplotlib",
    "pyyaml",
    # Wayline's SAGA bridge (saga-sidecar/bridge.py): the one place a graph +
    # testbed becomes a SAGA problem, offline and in the cluster alike.
    "wl-saga-sidecar",
]

[project.optional-dependencies]
# The backends drive their clusters through CLIs (kubectl; sbatch/srun/scontrol),
# not Python client libraries, so these extras are currently empty. They exist so
# backend-specific Python deps have a home (e.g. `kubernetes`, `pyslurm`) and so
# `uv sync --extra wayline` documents intent. See testbed/ for the external tools.
wayline = []
slurm = []

[project.scripts]
saga-wayline-run = "saga_exec.backends.wayline.run:main"
saga-wayline-analyze = "saga_exec.backends.wayline.analyze:main"
saga-slurm = "saga_exec.backends.slurm.saga_slurm:main"
saga-slurm-profile = "saga_exec.backends.slurm.profiling_test:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Local clone of ANRGUSC/wayline on branch saga-executor (next to this repo).
wl-saga-sidecar = { path = "../wayline/saga-sidecar", editable = true }
# Once branch saga-executor is pushed, use this instead and `uv lock`:
# wl-saga-sidecar = { git = "https://github.com/ANRGUSC/wayline", branch = "saga-executor", subdirectory = "saga-sidecar" }
#
# anrg-saga resolves to PyPI 2.1.0, which the bridge accepts for our model
# (model.nodeModel "cores" with cost/speed runtimes). Its default capacity model
# needs SAGA branch feature/capacity (2.2.0.dev1, unpublished); if that is ever
# wanted, pin it here, e.g.:
# anrg-saga = { git = "https://github.com/ANRGUSC/saga", branch = "feature/capacity" }

[tool.uv.build-backend]
module-name = "saga_exec"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
