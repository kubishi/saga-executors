apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: <cse-lambda1-ip>
  bindPort: 6443
nodeRegistration:
  name: cse-lambda1
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip
      value: <cse-lambda1-ip>
patches:
  directory: <path-to>/kubeadm/patches
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.37.0
controlPlaneEndpoint: cse-lambda1.lmumain.edu:6443
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
apiServer:
  certSANs:
    - cse-lambda1
    - cse-lambda1.lmumain.edu
    - cse-lambda1.lmu.edu
    - <cse-lambda1-ip>
    - 127.0.0.1
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
systemReserved:
  cpu: "48"
  memory: "150Gi"
kubeReserved:
  cpu: "4"
  memory: "8Gi"
evictionHard:
  memory.available: "8Gi"
  nodefs.available: "10%"
imageGCHighThresholdPercent: 75
imageGCLowThresholdPercent: 70
