:{"properties":{"cpu":{"type":"string"},"memory":{"type":"string"}},"type":"object"},"runner":{"description":"Execute this task on the named warm runner (pods labeled wl.io/runner=\u003cname\u003e) on its assigned node instead of in a fresh pod. Same contract: the invocation gets the pod's environment and uses the same data-agent protocol. image names the runner's image; command is ignored.","type":"string"},"runtime":{"description":"Optional scalar hint for expected runtime in seconds. Used as fallback when runtimeProfile has no entry for a node.","type":"number"},"runtimeProfile":{"description":"Per-node runtime hints in seconds. Keys are node names, values are expected runtimes. Example: {\"anrg-3\": 6, \"anrg-8\": 12}. Takes priority over the scalar runtime field. Profiler data (if available) takes priority over this.\n","type":"object","x-kubernetes-preserve-unknown-fields":true},"securityContext":{"description":"Pod-level securityContext (supplementalGroups, runAsUser, fsGroup, etc.). Applied verbatim as corev1.PodSecurityContext.\n","type":"object","x-kubernetes-preserve-unknown-fields":true},"type":{"description":"Vertex kind in the physical DAG. \"compute\" (default) runs the task's container. \"data\" holds/moves bytes with no pod: the controller realizes it through the data-agent (alias + push). A data vertex must have exactly one dependency and at least one successor.","enum":["compute","data"],"type":"string"},"volumeMounts":{"description":"Container-level volume mounts appended to the controller's base mounts. Each item is a standard K8s corev1.VolumeMount. Names must match a declared volume (either user-defined or controller-owned).\n","items":{"type":"object","x-kubernetes-preserve-unknown-fields":true},"type":"array"},"volumes":{"description":"Pod-level volumes appended to the controller's base mounts (wl-outputs, wl-shared). Each item is a standard K8s corev1.Volume. Reserved names (\"wl-outputs\", \"wl-shared\") are rejected at parse time.\n","items":{"type":"object","x-kubernetes-preserve-unknown-fields":true},"type":"array"}},"required":["name","image"],"type":"object"},"minItems":1,"type":"array"}},"required":["tasks"],"type":"object"},"status":{"properties":{"lastRunMakespan":{"description":"Makespan (seconds) of the most recent completed run.","type":"number"},"lastRunName":{"description":"Name of the most recent ODAG run.","type":"string"},"lastRunPhase":{"description":"Phase of the most recent run.","type":"string"},"profileSummary":{"description":"Condensed task-node runtime matrix from the profiler. Structure: { \"taskName\": { \"nodeName\": runtimeSeconds, ... }, ... }\n","type":"object","x-kubernetes-preserve-unknown-fields":true},"runCount":{"description":"Total number of runs triggered from this template.","type":"integer"}},"type":"object"}},"type":"object"}},"served":true,"storage":true,"subresources":{"status":{}}}]}}
