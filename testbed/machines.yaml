      measured: '2026-11-18T06:52:56'
      method: chained sha256 (task/fidelity_core.hash_loop) in task.pyz; single =
        1 process on 1 core, loaded = 1 process per physical core of the allocation,
        each pinned to its 2 threads
      basis: loaded
      reference: cse-lambda1
      hash_rate: 5217596.5
      speed:
        cse-lambda1: 1.0
        cse-isha: 0.7734
      machines:
        cse-lambda1:
          single: 5334839.3
          loaded: 5217596.5
          loaded_min_process: 4834743.8
          cores: 14
          python: 3.12.8
          openssl: OpenSSL 3.0.15 3 Sep 2024
        cse-isha:
          single: 3994604.5
          loaded: 4035081.2
          loaded_min_process: 3809794.3
          cores: 14
