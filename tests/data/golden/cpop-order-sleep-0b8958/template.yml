apiVersion: wl.io/v1
kind: ODAGTemplate
metadata:
  name: smoke-diamond-cpop-order-sleep-0b8958
  namespace: wl-runs
  labels:
    fidelity/scheduler: cpop
    fidelity/enact-order: order
    fidelity/model-nodes: cores
    fidelity/model-links: measured
    fidelity/mode: sleep
    fidelity/cpu: 1500m
    fidelity/sec-per-cost: '1.0'
    fidelity/bytes-per-size: '1.0'
    fidelity/hash-rate: '0.0'
  annotations:
    fidelity/speed: cse-lambda1=1.0,cse-isha=0.5
spec:
  scheduler: saga/cpop
  schedulerConfig:
    enactOrder: order
    options:
      x: 1
    model:
      nodeModel: cores
      cores:
        cse-isha: 3
        cse-lambda1: 8
      selfBandwidth:
        cse-isha: 1000000000.0
        cse-lambda1: 1000000000.0
      intraBandwidth:
        cse-isha: 1000000000.0
        cse-lambda1: 1000000000.0
  profiling:
    enabled: false
    runtimeSource: manual
    bandwidthSource: external
  retention:
    data:
      policy: keepLatest
      keepRuns: 1
  tasks:
  - name: a
    image: cse-lambda1:5000/wl-fidelity-task:saga-exec-940910d
    command:
    - python
    - task.py
    dependencies: []
    resources:
      cpu: 1500m
      memory: 570Mi
    runtime: 2.0
    runtimeProfile:
      cse-isha: 4.0
      cse-lambda1: 2.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '2.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=0.5
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: ''
    - name: FID_OUTPUTS
      value: to-b:10000000,to-c:20000000
    outputs:
    - name: to-b
      dataSize: '10000000'
    - name: to-c
      dataSize: '20000000'
  - name: b
    image: cse-lambda1:5000/wl-fidelity-task:saga-exec-940910d
    command:
    - python
    - task.py
    dependencies:
    - a
    resources:
      cpu: 1500m
      memory: 541Mi
    runtime: 4.0
    runtimeProfile:
      cse-isha: 8.0
      cse-lambda1: 4.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '4.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=0.5
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: a.to-b
    - name: FID_OUTPUTS
      value: to-d:5000000
    inputs:
    - producer: a
      object: to-b
    outputs:
    - name: to-d
      dataSize: '5000000'
  - name: c
    image: cse-lambda1:5000/wl-fidelity-task:saga-exec-940910d
    command:
    - python
    - task.py
    dependencies:
    - a
    resources:
      cpu: 1500m
      memory: 560Mi
    runtime: 3.0
    runtimeProfile:
      cse-isha: 6.0
      cse-lambda1: 3.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '3.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=0.5
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: a.to-c
    - name: FID_OUTPUTS
      value: to-d:5000000
    inputs:
    - producer: a
      object: to-c
    outputs:
    - name: to-d
      dataSize: '5000000'
  - name: d
    image: cse-lambda1:5000/wl-fidelity-task:saga-exec-940910d
    command:
    - python
    - task.py
    dependencies:
    - b
    - c
    resources:
      cpu: 1500m
      memory: 532Mi
    runtime: 1.0
    runtimeProfile:
      cse-isha: 2.0
      cse-lambda1: 1.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '1.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=0.5
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: b.to-d,c.to-d
    - name: FID_OUTPUTS
      value: ''
    inputs:
    - producer: b
      object: to-d
    - producer: c
      object: to-d
